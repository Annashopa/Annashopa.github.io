<!doctype html>
<html lang="vi" class="scroll-smooth bg-[#0B0D0C] text-[#F5F5F0]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANNASHOP® — The Future of Motion</title>
    <meta name="description" content="Thương hiệu giày thể thao cao cấp: Cầu lông, Tennis & Chạy bộ. Trải nghiệm mua sắm trực tuyến đỉnh cao tích hợp Google Sheets." />
    <meta property="og:title" content="ANNASHOP® — The Future of Motion" />
    <meta property="og:description" content="Thương hiệu giày thể thao cao cấp: Cầu lông, Tennis & Chạy bộ. Trải nghiệm mua sắm trực tuyến đỉnh cao tích hợp Google Sheets." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0D0C" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0D0C] text-[#F5F5F0] antialiased selection:bg-[#C8FF2F] selection:text-[#0B0D0C]">
    <div id="root"></div>

    <!-- Primary entry point for Vite development and build -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Bulletproof static fallback loader for GitHub Pages root deployment -->
    <script type="module">
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && (!root.hasChildNodes() || root.innerHTML.trim() === '')) {
          if (!document.querySelector('link[href*="assets/index.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = './assets/index.css';
            document.head.appendChild(link);
          }
          if (!document.querySelector('script[src*="assets/index.js"]')) {
            const script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/index.js';
            document.body.appendChild(script);
          }
        }
      }, 80);
    </script>
  </body>
</html>
